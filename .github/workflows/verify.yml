name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  replay:
    # Ubuntu 24.04 ships SWI-Prolog 9.0.4, the edition the transcripts were
    # recorded with; another version may print answers differently.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog 9.0.4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox
          swipl --version
      - name: Replay every chapter and check the shared module
        run: sh tools/verify_all.sh
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify_run.log
          path: build/verify_run.log
